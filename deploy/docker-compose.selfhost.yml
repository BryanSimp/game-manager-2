# Self-hosting stack: Postgres + API + web on one machine, built from this
# repo. No registry login, no Traefik, no Watchtower — those belong to the
# gamesmanager.app deployment (docker-compose.prod.yml) and assume
# infrastructure a self-hoster doesn't have.
#
#   cp .env.example .env      # then set BETTER_AUTH_SECRET and a DB password
#   docker compose -f deploy/docker-compose.selfhost.yml up -d --build
#
# Then open http://localhost:8080 — the first account you register becomes the
# admin. Migrations and the platform seed run automatically on API boot.
#
# nginx proxies /api to the API container so the browser talks to one origin.
# That is a requirement, not a convenience: sessions are HTTP-only cookies,
# and a second origin for the API would mean they were never sent.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a password in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gamemanager}
      TZ: ${TZ:-UTC}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gm} -d ${POSTGRES_DB:-gamemanager}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gamemanager}
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?generate one with openssl rand -base64 32}"
      # The public URL people type into a browser. Sign-in and password-reset
      # links are built from it, so it must match what the browser sees —
      # including the port, and https:// once a proxy terminates TLS.
      BETTER_AUTH_URL: ${APP_URL:-http://localhost:8080}
      APP_URL: ${APP_URL:-http://localhost:8080}
      CORS_ORIGINS: ${APP_URL:-http://localhost:8080}
      # Set to false once everyone who needs an account has one.
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      API_PORT: "3001"
      API_HOST: 0.0.0.0
      # All of these are optional and can instead be pasted into the app's
      # admin Settings page, which takes precedence over the environment.
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      STEAMGRIDDB_API_KEY: ${STEAMGRIDDB_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      IMAGE_DIR: /data/images
      TZ: ${TZ:-UTC}
    volumes:
      - images:/data/images
    networks:
      - internal

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx.selfhost.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal

volumes:
  pgdata:
    name: gm2-selfhost-pgdata
  images:
    name: gm2-selfhost-images

networks:
  internal:
