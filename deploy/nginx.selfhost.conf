# nginx for the single-host self-hosting stack (deploy/docker-compose.selfhost.yml).
#
# Same rules as apps/web/nginx.conf, plus an /api proxy. The production stack
# doesn't need one: Traefik routes /api to the API container before the
# request ever reaches nginx. Without a reverse proxy in front, nginx has to
# do that itself — and it must, because the web app authenticates with
# same-origin HTTP-only cookies. Serving the API on a second port instead
# would make every request cross-origin and the session cookie would not be
# sent.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploaded covers and console art are streamed from the API; 5MB is the
    # upload limit the API itself enforces.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The API runs with trustProxy, so this header is what its rate limits
        # bucket by. It is honest here: nothing but this nginx can reach the
        # API container.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An OCR import or a Steam import can hold a request open for a while.
        proxy_read_timeout 300s;
    }

    # Public routes are prerendered to real HTML by scripts/prerender.mjs:
    # `$uri/` picks up dist/guides/<slug>/index.html and friends, and `/` gets
    # dist/index.html. Everything else is a signed-in client route and falls
    # back to app.html — the empty shell. Falling back to index.html would
    # flash the prerendered landing page before the app mounted.
    location / {
        try_files $uri $uri/ /app.html;
    }

    # Long cache for hashed build assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
