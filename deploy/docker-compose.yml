# Local development: Postgres only. Run the apps with pnpm dev.
#   docker compose -f deploy/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gm_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-gamemanager}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gm} -d ${POSTGRES_DB:-gamemanager}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
