name: Build and push Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

# one build at a time, newest commit wins — without this, delayed runs (e.g.
# after a GitHub outage) can finish out of order and an older commit's image
# ends up as :latest
concurrency:
  group: docker-images
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      matrix:
        include:
          - name: gm2-api
            dockerfile: apps/api/Dockerfile
          - name: gm2-web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          TAGS="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}:latest"
          TAGS="$TAGS,ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}:${GITHUB_SHA::7}"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            TAGS="$TAGS,docker.io/$DOCKERHUB_USERNAME/${{ matrix.name }}:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.tags.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
