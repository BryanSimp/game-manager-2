<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Game Manager">
  <!--
    The tab icon. It matches the "🎮 Game Manager" wordmark the nav, auth card
    and marketing header all use, so the tab reads as the same product.

    Drawn as a mask rather than as white shapes over flat fills: the tile is a
    gradient, so a "knocked out" d-pad painted in a single indigo would only
    line up with the gradient at one height. The mask makes the cut-outs
    genuinely transparent instead.

    Kept to five shapes on purpose — at 16px a tab favicon is ~16 device
    pixels, and interior detail finer than this turns to grey mush.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818cf8" />
      <stop offset="1" stop-color="#4f46e5" />
    </linearGradient>
    <mask id="pad">
      <rect width="64" height="64" fill="#000" />
      <g fill="#fff">
        <rect x="4" y="15" width="56" height="24" rx="12" />
        <circle cx="15" cy="38" r="11" />
        <circle cx="49" cy="38" r="11" />
      </g>
      <g fill="#000">
        <rect x="11" y="27.25" width="16" height="5.5" rx="2" />
        <rect x="16.25" y="22" width="5.5" height="16" rx="2" />
        <circle cx="44" cy="26.5" r="3.8" />
        <circle cx="51.5" cy="34" r="3.8" />
      </g>
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)" />
  <rect width="64" height="64" fill="#fff" mask="url(#pad)" />
</svg>
