<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />

    <!--
      Static defaults. Routes override these at runtime via lib/seo.ts, which
      Googlebot picks up because it renders JavaScript — but scrapers that
      don't (most social previews, some ad crawlers) only ever see what's
      here, so these describe the landing page rather than being placeholders.
    -->
    <title>Game Manager — track your game library, backlog and progress</title>
    <meta
      name="description"
      content="Free game library manager: sync your Steam library, catalogue physical and digital games across every console you own, track story progress mission by mission, and see how long your backlog will really take."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://gamesmanager.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Game Manager" />
    <meta property="og:title" content="Game Manager — track your game library, backlog and progress" />
    <meta
      property="og:description"
      content="One library for Steam, every console you own and the shelf of cartridges. Mission-level progress tracking and honest time-to-beat estimates for your backlog."
    />
    <meta property="og:url" content="https://gamesmanager.app/" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Google AdSense site tag. Google's instructions are explicit that this
      goes in the <head> of every page, and site verification plus Auto ads
      both depend on it being in the served HTML rather than injected later by
      the app — a verifier that doesn't run our JavaScript has to find it here.

      The publisher id is not a secret: it ships in the HTML of every AdSense
      site by design. lib/adsense.ts carries the same id for the ad units it
      renders — keep the two in step.
    -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8120053686454465"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
