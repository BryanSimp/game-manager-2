server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Public routes are prerendered to real HTML by scripts/prerender.mjs:
    # `$uri/` picks up dist/guides/<slug>/index.html and friends, and `/` gets
    # dist/index.html. Everything else is a signed-in client route and falls
    # back to app.html — the empty shell. Falling back to index.html would
    # flash the prerendered landing page before the app mounted.
    location / {
        try_files $uri $uri/ /app.html;
    }

    # Long cache for hashed build assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
